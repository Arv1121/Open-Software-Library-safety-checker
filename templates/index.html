<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Safety Checker - OSS Vulnerability Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 5px;
        }
        
        .tagline {
            color: #999;
            font-size: 0.95em;
            font-style: italic;
        }
        
        .search-form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        
        input, select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .search-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            grid-column: 1 / -1;
        }
        
        .search-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .search-button:active {
            transform: translateY(0);
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 600;
            margin: 20px 0;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            color: #999;
            font-size: 0.9em;
        }
        
        @media (max-width: 768px) {
            .search-form {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Library Safety Checker</h1>
            <p class="subtitle">Open Source Software (OSS) Vulnerability Scanner</p>
            <p class="tagline">Check library vulnerabilities, licenses, and maintenance status</p>
        </header>
        
        <form id="searchForm" class="search-form" action="/search" method="POST">
            <div class="form-group">
                <label for="package">Package Name *</label>
                <input type="text" id="package" name="package" placeholder="e.g., flask, requests" required>
            </div>
            
            <div class="form-group">
                <label for="ecosystem">Ecosystem</label>
                <select id="ecosystem" name="ecosystem">
                    <option value="PyPI">PyPI (Python)</option>
                    <option value="npm">NPM (Node.js)</option>
                    <option value="Maven">Maven (Java)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="version">Version (Optional)</label>
                <input type="text" id="version" name="version" placeholder="e.g., 1.0.0">
            </div>
            
            <button type="submit" class="search-button">🔍 Check Library</button>
        </form>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <span>Scanning for vulnerabilities...</span>
        </div>
        
        <div class="footer">
            <p>Data sourced from OSV (Open Source Vulnerabilities) and PyPI</p>
            <p>This tool is open source and available on GitHub</p>
        </div>
    </div>
</body>
</html>
