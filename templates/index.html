<!DOCTYPE html>
<html>
<head>
    <title>Library Safety Checker</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 50px auto; }
        form { background: #f5f5f5; padding: 20px; border-radius: 8px; }
        input, select { padding: 10px; margin: 10px 0; width: 100%; }
        button { background: #667eea; color: white; padding: 10px 20px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>📚 Library Safety Checker</h1>
    <form action="/search" method="POST">
        <input type="text" name="package" placeholder="Package name (e.g., flask)" required>
        <select name="ecosystem">
            <option>PyPI</option>
            <option>npm</option>
            <option>Maven</option>
        </select>
        <input type="text" name="version" placeholder="Version (optional)">
        <button type="submit">Check Library</button>
    </form>
</body>
</html>
